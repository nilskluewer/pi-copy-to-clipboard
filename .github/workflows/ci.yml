name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catches breakage from new Pi releases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Linux clipboard utilities
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xclip xsel wl-clipboard
      - name: Install Pi
        run: npm install -g @earendil-works/pi-coding-agent@latest
      - name: Install dependencies
        run: npm ci --omit=peer
      - name: Unit tests
        run: npm test
      - name: Real clipboard tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:clipboard
      - name: Real clipboard tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm run test:clipboard
      - name: Smoke test (load the packed tarball in Pi)
        run: npm run smoke
